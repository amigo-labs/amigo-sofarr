# amigo-sofarr – Beispielkonfiguration
# Kopieren nach /config/sofarr.toml (im Container) bzw. per SOFARR_CONFIG angeben.
# Fehlt die Datei, gelten die Standardwerte unten.

[server]
bind = "0.0.0.0:7676"

[log]
# Wird von RUST_LOG überschrieben, falls gesetzt.
level = "info"      # trace | debug | info | warn | error
format = "pretty"   # pretty | json

[database]
path = "/config/sofarr.db"

[automation]
# shadow: nur protokollieren, was sofarr tun würde (nichts wird heruntergeladen oder verschoben)
# live:   Releases an den Download-Client schicken und fertige Downloads importieren
mode = "shadow"

[rss]
interval_minutes = 30   # 0 schaltet den RSS-Sync ab

# TMDB-Zugang (v3-API-Key oder v4-Read-Token) – für Metadaten und Import Lists.
# [tmdb]
# api_key = "dein-tmdb-key"

# Radarr-Instanz für den einmaligen Import und die Abgleiche.
# [radarr]
# url = "http://radarr:7878"
# api_key = "dein-radarr-api-key"

# Newznab-Indexer (beliebig viele Blöcke).
# [[indexer]]
# name = "mein-indexer"
# url = "https://indexer.example/api"
# api_key = "dein-indexer-api-key"
# categories = [2000]
# tv_categories = [5000]
# limit = 100
# tags = ["kinder"]   # nur für Filme/Serien mit einem dieser Tags (leer: alle)

# Serien (Phase 5): Sonarr für den Import, TVDB für Metadaten.
# [sonarr]
# url = "http://sonarr:8989"
# api_key = "dein-sonarr-api-key"
# [tvdb]
# api_key = "dein-tvdb-key"
# pin = "optional"

# Download-Client (nur im Modus "live" genutzt).
# [nzbget]
# url = "http://nzbget:6789"
# username = "nzbget"
# password = "dein-passwort"
# category = "movies"
# tv_category = "tv"

[download]
check_interval_minutes = 2
# Nach dem Import: Download aus der nzbget-History entfernen und den Ordner löschen,
# wenn kein Video mehr darin liegt.
remove_completed = true
# Nach einem fehlgeschlagenen Download erneut suchen (Filme, Serien). Ohne Angabe gilt
# `autoRedownloadFailed` aus dem Radarr- bzw. Sonarr-Import, ohne Import: aus.
# redownload_failed_movies = false
# redownload_failed_series = true
# Falls nzbget Pfade anders sieht als sofarr (andere Container-Mounts):
# [[download.path_map]]
# remote = "/downloads"
# local = "/data/usenet"

[backup]
# Sicherungen der Datenbank (ohne diese Datei: sie enthält Zugangsdaten).
dir = "/config/backups"
# Stunden zwischen geplanten Sicherungen; 0 schaltet sie ab.
interval_hours = 24
# So viele geplante Sicherungen bleiben (mindestens 1); manuelle bleiben immer.
keep = 7

[auth]
# Anmeldung für API und Oberfläche; aus: jeder im Netz erreicht die API.
enabled = false
# username = "daniel"
# Hash erzeugen mit `amigo-sofarr hash-password` (Argon2id).
# password_hash = "$argon2id$v=19$…"
# Für Skripte: Header `X-Api-Key`.
# api_key = "…"
# Sitzungen enden nach so vielen Tagen ohne Nutzung.
session_days = 30
# Adressbereiche ohne Anmeldung, z. B. das Heimnetz.
trusted_networks = []
# Reverse Proxys, deren X-Forwarded-For zählt.
trusted_proxies = []

[import_lists]
interval_hours = 24   # 0 schaltet die Import Lists ab

[library]
# Metadaten-Refresh (TMDB/TVDB, falls eingetragen) mit anschließendem Festplatten-Scan
# laut rescanAfterRefresh; 0 schaltet ihn ab. Der erste Lauf folgt ein Intervall nach dem Start.
refresh_interval_hours = 24
