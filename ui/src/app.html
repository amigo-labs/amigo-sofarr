<!doctype html>
<html lang="de" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <title>sofarr</title>
    <script>
      // Applies the remembered color scheme before the first paint (see lib/theme/theme.ts).
      try {
        var choice = localStorage.getItem('sofarr-theme');
        if (choice === 'light' || choice === 'dark') {
          document.documentElement.setAttribute('data-color-mode', choice);
        }
      } catch (e) {
        // Blocked storage: the page follows the system.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <noscript>
      <p class="noscript">
        Die Weboberfläche von sofarr benötigt JavaScript. Bitte JavaScript in diesem Browser
        aktivieren und die Seite neu laden.
      </p>
    </noscript>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
