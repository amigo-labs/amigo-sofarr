<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <title>sofarr</title>
    <script>
      // The palette is always dark (`data-theme` above, lib/theme/theme.ts); only the sidebar's
      // collapsed state is applied before the first paint (see lib/sidebar.ts).
      try {
        if (localStorage.getItem('sofarr-sidebar') === 'collapsed') {
          document.documentElement.setAttribute('data-sidebar', 'collapsed');
        }
      } catch (e) {
        // Blocked storage: the sidebar stays expanded.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <noscript>
      <p class="noscript">
        Die Weboberfläche von sofarr benötigt JavaScript. Bitte JavaScript in diesem Browser
        aktivieren und die Seite neu laden.
      </p>
    </noscript>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
