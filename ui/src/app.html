<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <title>sofarr</title>
    <script>
      // Applies the remembered theme choice before the first paint (see lib/theme/theme.ts):
      // the document is dark unless `light` or `system` is stored.
      try {
        var choice = localStorage.getItem('sofarr-theme');
        if (choice === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else if (choice === 'system') {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch (e) {
        // Blocked storage: the page stays dark.
      }
      // The same for the sidebar's collapsed state (see lib/sidebar.ts).
      try {
        if (localStorage.getItem('sofarr-sidebar') === 'collapsed') {
          document.documentElement.setAttribute('data-sidebar', 'collapsed');
        }
      } catch (e) {
        // Blocked storage: the sidebar stays expanded.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <noscript>
      <p class="noscript">
        Die Weboberfläche von sofarr benötigt JavaScript. Bitte JavaScript in diesem Browser
        aktivieren und die Seite neu laden.
      </p>
    </noscript>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
