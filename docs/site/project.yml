features:
  - title: { en: Own release-name parser, de: Eigener Release-Parser }
    text:
      en: A tokenizer-based parser reads title, year, source, resolution, edition, release group and languages from a release name, measured field by field against thousands of real release names.
      de: Ein Tokenizer-basierter Parser liest Titel, Jahr, Quelle, Auflösung, Edition, Release-Gruppe und Sprachen aus einem Release-Namen – Feld für Feld gemessen an Tausenden echten Release-Namen.
  - title: { en: Decisions by your quality rules, de: Entscheidungen nach eigenen Qualitätsregeln }
    text:
      en: Quality profiles with cutoff and upgrades, size limits, custom formats with scores, propers and repacks, language and indexer settings decide which release to grab.
      de: Qualitätsprofile mit Cutoff und Upgrades, Größengrenzen, Custom Formats mit Punktwerten, Propers und Repacks sowie Sprach- und Indexer-Einstellungen entscheiden, welches Release geholt wird.
  - title: { en: Usenet from search to library, de: Usenet von der Suche bis zur Bibliothek }
    text:
      en: New releases via Newznab RSS and search, downloads through nzbget, then import with renaming into the library — hardlink-friendly with downloads and library under one mount.
      de: Neue Releases über Newznab-RSS und -Suche, Downloads über nzbget, danach Import mit Umbenennung in die Bibliothek – Hardlink-freundlich, mit Downloads und Bibliothek unter einem Mount.
  - title: { en: Move over from Radarr and Sonarr, de: Umzug von Radarr und Sonarr }
    text:
      en: Imports profiles, custom formats, quality definitions, settings and the library from a running instance, and a shadow mode runs alongside it and logs what sofarr would grab before it takes over.
      de: Übernimmt Profile, Custom Formats, Qualitätsdefinitionen, Einstellungen und die Bibliothek aus einer laufenden Instanz; ein Shadow-Modus läuft daneben und protokolliert, was sofarr holen würde, bevor es übernimmt.
  - title: { en: TV shows, de: Serien }
    text:
      en: Episodes, multi-episode files, season packs, daily and anime numbering, specials and series metadata from TVDB.
      de: Episoden, Mehrfach-Episoden, Staffelpakete, tägliche und Anime-Nummerierung, Specials und Serien-Metadaten von TVDB.
  - title: { en: Web UI, de: Web-Oberfläche }
    text:
      en: Built into the binary, with an overview, movies, series, calendar, missing, blocklist and backups; monitor, search, change profiles, rename and move from the browser, with a light and a dark theme.
      de: Im Binary eingebaut, mit Übersicht, Filmen, Serien, Kalender, Fehlendem, Blocklist und Backups; überwachen, suchen, Profile ändern, umbenennen und verschieben im Browser, mit hellem und dunklem Design.
  - title: { en: Discover, de: Entdecken }
    text:
      en: Trending and popular titles from TMDB, search, previews, people with their filmography and adding movies and series in one click; a person can become an import list.
      de: Trends und beliebte Titel von TMDB, Suche, Vorschauen, Personen mit Filmografie und Filme und Serien mit einem Klick hinzufügen; aus einer Person wird auf Wunsch eine Import-Liste.
  - title: { en: IMDb ratings, de: IMDb-Bewertungen }
    text:
      en: Ratings and votes from IMDb's public datasets in every list, sortable and filterable, refreshed daily.
      de: Bewertungen und Stimmen aus den öffentlichen IMDb-Datensätzen in jeder Liste, sortier- und filterbar, täglich aktualisiert.
  - title: { en: Subtitles, de: Untertitel }
    text:
      en: Fetches missing German, English and forced subtitles from OpenSubtitles.com and stores them by Jellyfin's naming rules.
      de: Holt fehlende deutsche, englische und erzwungene Untertitel von OpenSubtitles.com und legt sie nach Jellyfins Benennungsregeln ab.
  - title: { en: Trailers, de: Trailer }
    text:
      en: Downloads TMDB trailers with yt-dlp into each movie's trailers folder, within a daily budget.
      de: Lädt Trailer von TMDB mit yt-dlp in den Trailer-Ordner jedes Films, innerhalb eines täglichen Budgets.
  - title: { en: Media info, de: Media-Infos }
    text:
      en: An own reader for MKV and MP4 headers finds codecs, resolution, HDR, audio and subtitle tracks of every file and fills the naming tokens.
      de: Ein eigener Leser für MKV- und MP4-Header ermittelt Codecs, Auflösung, HDR, Ton- und Untertitelspuren jeder Datei und füllt die Benennungs-Tokens.
  - title: { en: Backups and login, de: Backups und Anmeldung }
    text:
      en: Scheduled and manual backups with restore; an optional login with sessions, API key and trusted networks.
      de: Geplante und manuelle Backups mit Wiederherstellung; eine abschaltbare Anmeldung mit Sitzungen, API-Schlüssel und vertrauenswürdigen Netzen.
