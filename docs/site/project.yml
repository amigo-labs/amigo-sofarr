# Content for amigo-labs.dev/sofarr/ — format: https://github.com/amigo-labs/website/blob/main/docs/project-data.md
schema: 1
slug: sofarr
name: Sofarr
status: beta
accent: "#2bd67b"
tagline:
  en: Movies and TV shows, managed from the sofa
  de: Filme und Serien, vom Sofa aus verwaltet
summary:
  en: >-
    One lightweight service that finds new releases on Usenet indexers, decides based on your
    quality rules, hands them to your download client and imports them into your library. Written in
    Rust: a single static binary, a single container, SQLite.
  de: >-
    Ein schlanker Dienst, der neue Releases bei Usenet-Indexern findet, anhand der eigenen Qualitätsregeln
    entscheidet, sie an den Download-Client übergibt und in die Bibliothek importiert. Geschrieben in
    Rust: ein statisches Binary, ein Container, SQLite.
about:
  en: |
    amigo-sofarr is in beta: movies, TV shows and the web interface are in place, and sofarr is now
    being tried out in shadow mode next to a running Radarr and Sonarr before it takes over for good.

    The screenshots show a made-up demo library; its titles, people and posters do not exist.

    It is an independent, clean-room project: not part of, endorsed by or derived from Sonarr, Radarr
    or any other Servarr project. No Servarr source code or test data is used; existing instances are
    only observed through their public HTTP API to check that sofarr behaves the same.
  de: |
    amigo-sofarr ist in der Beta: Filme, Serien und die Web-Oberfläche stehen, und sofarr wird jetzt im
    Shadow-Modus neben einem laufenden Radarr und Sonarr erprobt, bevor es ganz übernimmt.

    Die Bilder zeigen eine erfundene Demo-Bibliothek; Titel, Personen und Poster gibt es nicht.

    Es ist ein unabhängiges Clean-Room-Projekt: weder Teil von Sonarr, Radarr oder einem anderen
    Servarr-Projekt noch von ihnen unterstützt oder abgeleitet. Es wird kein Servarr-Quellcode und
    keine Servarr-Testdaten verwendet; bestehende Instanzen werden nur über ihre öffentliche
    HTTP-API beobachtet, um zu prüfen, dass sofarr sich gleich verhält.
platforms: [docker]
license: MIT

